[project]
name = "opencredit-ai"
version = "0.1.0"
description = "AI-based microloan risk assessment for small businesses"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "openai>=1.0.0",
    "python-multipart",
    "pypdf",
    "python-docx",
    "openpyxl",
    "pillow",
    "pytesseract",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
    "xgboost==3.4.1",
    "shap==0.52.0",
]

[tool.vercel]
entrypoint = "backend.app.main:app"